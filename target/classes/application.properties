# ===== Cấu hình Server =====
server.port=8080

# ===== Cấu hình Database (MySQL) =====
spring.datasource.url=jdbc:mysql://localhost:3306/hestia_smarthome?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ===== Cấu hình MQTT Broker =====
# Đổi thành IP/domain của Mosquitto Broker đang chạy (VD: broker chạy trên Raspberry Pi, VPS...)
mqtt.broker.url=tcp://broker.hivemq.com:1883
# Sửa lại Client ID để tránh bị đá văng khỏi Broker do trùng tên với người khác
mqtt.client.id.in=backend-subscriber-dung12345
mqtt.client.id.out=backend-publisher-dung12345
mqtt.topic.sensor=hestia/dung12345/sensors
mqtt.topic.control=hestia/dung12345/led/control
mqtt.topic.status=hestia/dung12345/led/status

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true


logging.level.org.springframework.integration.mqtt=DEBUG
logging.level.org.eclipse.paho.client.mqttv3=DEBUG

# ===== Cấu hình Server =====
server.port=8080

# ===== Cấu hình Database (MySQL) =====
spring.datasource.url=jdbc:mysql://localhost:3306/hestia_smarthome?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ===== Cấu hình MQTT Broker =====
# Đổi thành IP/domain của Mosquitto Broker đang chạy (VD: broker chạy trên Raspberry Pi, VPS...)
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id.in=backend-subscriber
mqtt.client.id.out=backend-publisher

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true